name: WorkBridge source checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: workbridge-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/workbridge-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s synology/tests -v
      - run: python -m compileall -q synology tools
