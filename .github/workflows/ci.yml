name: WorkBridge source checks
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/workbridge-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s media_bridge/tests -v
        if: runner.os == 'Linux'
      - run: python -m compileall -q media_bridge tools
      - run: python -m unittest discover -s tests -v
